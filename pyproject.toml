[project]
name = "veil-privacy-firewall"
version = "1.0.0"
description = "On-device semantic privacy firewall for live screen and file sharing"
requires-python = ">=3.11"
license = {text = "All Rights Reserved"}
authors = [{name = "Snapdragon AI Lab Challenge Participant"}]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
